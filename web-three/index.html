<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8F0" />
    <title>First Slice — A New York Story</title>
    <style>
      /* Portrait-first (the Vertical-First Law). The canvas owns the screen;
         HUD overlays arrive at M4+ as siblings of #app. */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #fff8f0;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none; /* touch controls land at M7; nothing else may steal gestures */
      }
      #boot-note {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(12px, env(safe-area-inset-bottom));
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 13px;
        color: #6d4c7d;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-note">First Slice — web build. The Godot greybox leads; this follows (docs/23).</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
